<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <title>Cadastrar Pessoa</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

</head>

<body>

    <div class="sidebar">

        <h2>Sistema</h2>

        <a href="dashboard.html">
            Tela Inicial
        </a>

        <a href="pessoas.html">
            Cadastros
        </a>

        <a href="funcoes.html">
            Funções
        </a>

        <a href="/logout">
            Sair
        </a>

    </div>

    <div class="content">

        <h1>Cadastro de Pessoas</h1>

        <form
            class="formulario"
            action="/cadastrar"
            method="POST"
            enctype="multipart/form-data"
        >

            <input
                type="text"
                name="nome"
                placeholder="Nome"
                required
            >

            <input
                type="text"
                name="cpf"
                id="cpf"
                placeholder="CPF"
                maxlength="14"
                required
            >

            <select
                name="funcao"
                id="funcao"
                required
            >
                <option value="">
                    Selecione uma função
                </option>
            </select>

            <input
                type="date"
                name="nascimento"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="E-mail"
                required
            >

            <div class="telefone-container">

                <select
                    id="codigoPais"
                    name="codigoPais"
                >

                    <option value="+55">
                        +55 🇧🇷
                    </option>

                    <option value="+1">
                        +1 🇺🇸
                    </option>

                    <option value="+44">
                        +44 🇬🇧
                    </option>

                    <option value="+351">
                        +351 🇵🇹
                    </option>

                </select>

                <input
                    type="text"
                    name="telefone"
                    id="telefone"
                    placeholder="(00) 00000-0000"
                    maxlength="15"
                    required
                >

            </div>

            <input
                type="text"
                name="endereco"
                placeholder="Endereço"
                required
            >

            <input
                type="file"
                name="arquivo"
            >


            <div class="acoes-formulario">

                    <button type="submit">
                        Cadastrar Pessoa
                    </button>

                    <a
                        href="pessoas.html"
                        class="btn-voltar"
                    >
                        Voltar
                    </a>

                </div>
            </div>
        

    </div>

    <script>

    document.addEventListener("DOMContentLoaded", () => {

        const telefone = document.getElementById("telefone");

        telefone.addEventListener("input", (e) => {

            let valor = e.target.value.replace(/\D/g, "");

            valor = valor.substring(0, 11);

            if (valor.length > 10) {

                valor = valor.replace(
                    /^(\d{2})(\d{5})(\d{4}).*/,
                    "($1) $2-$3"
                );

            } else {

                valor = valor.replace(
                    /^(\d{2})(\d{4})(\d{0,4}).*/,
                    "($1) $2-$3"
                );
            }

            e.target.value = valor;
        });
        const cpf = document.getElementById("cpf");

        cpf.addEventListener("input", (e) => {

            let valor = e.target.value.replace(/\D/g, "");

            valor = valor.substring(0, 11);

            valor = valor.replace(
                /^(\d{3})(\d)/,
                "$1.$2"
            );

            valor = valor.replace(
                /^(\d{3})\.(\d{3})(\d)/,
                "$1.$2.$3"
            );

            valor = valor.replace(
                /\.(\d{3})(\d)/,
                ".$1-$2"
            );

            e.target.value = valor;
        });

        function validarCPF(cpf) {

            cpf = cpf.replace(/\D/g, "");

            if (cpf.length !== 11) return false;

            if (/^(\d)\1+$/.test(cpf)) return false;

            let soma = 0;

            for (let i = 0; i < 9; i++) {
                soma += parseInt(cpf.charAt(i)) * (10 - i);
            }

            let resto = (soma * 10) % 11;

            if (resto === 10 || resto === 11) {
                resto = 0;
            }

            if (resto !== parseInt(cpf.charAt(9))) {
                return false;
            }

            soma = 0;

            for (let i = 0; i < 10; i++) {
                soma += parseInt(cpf.charAt(i)) * (11 - i);
            }

            resto = (soma * 10) % 11;

            if (resto === 10 || resto === 11) {
                resto = 0;
            }

            if (resto !== parseInt(cpf.charAt(10))) {
                return false;
            }

            return true;
        }

        document.querySelector(".formulario")
        .addEventListener("submit", (e) => {

            if (!validarCPF(cpf.value)) {

                e.preventDefault();

                alert("CPF inválido!");
            }
        });
        async function carregarFuncoes() {

            const response = await fetch("/funcoes");

            const funcoes = await response.json();

            const select = document.getElementById("funcao");

            funcoes.forEach(funcao => {

                select.innerHTML += `
                    <option value="${funcao.nome}">
                        ${funcao.nome}
                    </option>
                `;
            });
        }

        carregarFuncoes();
    });

    </script>

</body>
</html>
